<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="/js/legacy-hash.js"></script>
<script>document.documentElement.classList.add('js');</script>
<title>{% block title %}{{ page_title }}{% endblock %}</title>
<meta name="description" content="{% block description %}{{ page_description }}{% endblock %}">
<link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg">
<link rel="apple-touch-icon" href="/assets/images/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css">
</head>
<body data-page="{{ page }}"{% if section %} data-section="{{ section }}"{% endif %}{% if current_user %} class="logged-in{% if current_user.admin %} is-admin{% endif %}{% if section in ('login', 'logout') %} auth-mode{% endif %}"{% elif section in ('login', 'logout') %} class="auth-mode"{% endif %}>
{% include "partials/header.html" %}
<main>
{% block content %}{% endblock %}
</main>
{% include "partials/footer.html" %}

<a class="wa-float" href="https://wa.me/250783689231" target="_blank" rel="noopener" aria-label="Chat on WhatsApp"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 0 0-7.7 13.6L3 21l4.5-1.2A9 9 0 1 0 12 3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M9 7.8c-.5 0-1 .6-1 1.3 0 2.9 3.1 6 6 6 .7 0 1.3-.5 1.3-1l-.1-.7-1.9-.9-.9.9c-1-.5-1.9-1.4-2.4-2.4l.9-.9-.9-1.9z" fill="currentColor"/></svg></a>

<button class="ask-float" id="ask-float" type="button" aria-haspopup="dialog" aria-controls="ask-dialog"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v8A2.5 2.5 0 0 1 17.5 16H10l-4.6 3.7A1 1 0 0 1 4 18.9z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M9.6 7.4a2.5 2.5 0 1 1 3.3 2.4c-.6.2-.9.7-.9 1.3v.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="14.2" r="1.1" fill="currentColor"/></svg><span>Ask Tom</span></button>

<dialog id="ask-dialog" class="msg-dialog ask-dialog" aria-labelledby="ask-title">
  <button type="button" class="msg-close" id="ask-close" aria-label="Close">&times;</button>
  <h3 id="ask-title">Ask Tom</h3>
  <p class="ask-intro">Type everything you want to ask — we reply fast, day or night.</p>
  <form id="ask-form">
    <label for="ask-name">Full name</label>
    <input id="ask-name" type="text" autocomplete="name" required>
    <label for="ask-email">Email</label>
    <input id="ask-email" type="email" autocomplete="email" placeholder="you@example.com" required>
    <label for="ask-question">Your question</label>
    <textarea id="ask-question" placeholder="Type everything you want to ask…" required></textarea>
    <button class="btn" type="submit">Send question</button>
    <p id="ask-status" class="status" role="status"></p>
  </form>
</dialog>

{% include "partials/support-dialog.html" %}

<!-- page scripts (i18n defines the global T before every other script) -->
<script src="/js/i18n.js"></script>
<script src="/js/empty-state.js"></script>
<script src="/js/session.js"></script>
<script src="/js/support.js"></script>
<script src="/js/ask.js"></script>
<script src="/js/nav.js"></script>
<script src="/js/search.js"></script>
<script src="/js/select.js"></script>
<script>
(function () {
  var header = document.querySelector('header');
  if (!header) { return; }
  function onScroll() { header.classList.toggle('scrolled', window.scrollY > 8); }
  window.addEventListener('scroll', onScroll, {passive: true});
  onScroll();
})();
</script>
{% block scripts %}{% endblock %}
</body>
</html>
