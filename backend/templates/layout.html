<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="/js/legacy-hash.js"></script>
<title>{% block title %}{{ page_title }}{% endblock %}</title>
<meta name="description" content="{% block description %}{{ page_description }}{% endblock %}">
<link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg">
<link rel="apple-touch-icon" href="/assets/images/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css">
</head>
<body data-page="{{ page }}"{% if current_user %} class="logged-in{% if current_user.admin %} is-admin{% endif %}"{% endif %}>
{% include "partials/header.html" %}
<main>
{% block content %}{% endblock %}
</main>
{% include "partials/footer.html" %}

<a class="wa-float" href="https://wa.me/250783689231" target="_blank" rel="noopener" aria-label="Chat on WhatsApp"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 0 0-7.7 13.6L3 21l4.5-1.2A9 9 0 1 0 12 3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M9 7.8c-.5 0-1 .6-1 1.3 0 2.9 3.1 6 6 6 .7 0 1.3-.5 1.3-1l-.1-.7-1.9-.9-.9.9c-1-.5-1.9-1.4-2.4-2.4l.9-.9-.9-1.9z" fill="currentColor"/></svg></a>

{% include "partials/support-dialog.html" %}

<!-- page scripts (i18n defines the global T before every other script) -->
<script src="/js/i18n.js"></script>
<script src="/js/empty-state.js"></script>
<script src="/js/session.js"></script>
<script src="/js/support.js"></script>
<script src="/js/search.js"></script>
<script src="/js/select.js"></script>
<script>
(function () {
  var header = document.querySelector('header');
  if (!header) { return; }
  function onScroll() { header.classList.toggle('scrolled', window.scrollY > 8); }
  window.addEventListener('scroll', onScroll, {passive: true});
  onScroll();
})();
</script>
{% block scripts %}{% endblock %}
</body>
</html>
