{% extends "layout.html" %}
{% block content %}
<section class="auth-page">
  <div class="auth-card">
    <p class="eyebrow">Account</p>
    <h3>Forgot your password?</h3>
    <p class="auth-sub">Enter the email on your account and we will send a reset link.</p>
    <form id="forgot-form" autocomplete="off">
      <div class="auth-field">
        <label for="f-email">Email</label>
        <div class="auth-input">
          <svg class="auth-ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M4 7.5l8 6 8-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
          <input id="f-email" type="email" autocomplete="email" placeholder="you@example.com" required>
        </div>
      </div>
      <button class="btn auth-submit" type="submit">Send reset link</button>
      <p id="forgot-status" class="status" role="status" aria-live="polite"></p>
    </form>
    <p class="auth-switch"><a href="/login">Back to login</a></p>
  </div>
</section>
{% endblock %}
{% block scripts %}<script src="/js/password-reset.js"></script>{% endblock %}
