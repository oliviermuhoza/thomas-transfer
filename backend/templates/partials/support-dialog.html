<!-- ================= SUPPORT MESSAGE DIALOG ================= -->
<dialog id="msg-dialog" class="msg-dialog" aria-labelledby="msg-title">
  <button type="button" class="msg-close" id="msg-close" aria-label="Close">&times;</button>
  <h3 id="msg-title">Write to support</h3>
  <form id="support-form">
    <label for="s-name">Full name</label>
    <input id="s-name" type="text" autocomplete="name" placeholder="Full name" required>
    <label for="s-email">Email</label>
    <input id="s-email" type="email" autocomplete="email" placeholder="you@example.com" required>
    <label for="s-phone">Phone number</label>
    <input id="s-phone" type="tel" autocomplete="tel" placeholder="+250 ..." required>
    <label for="s-msg">Message</label>
    <textarea id="s-msg" placeholder="Write your message here" required></textarea>
    <button class="btn" type="submit">Send message</button>
    <p id="support-status" class="status" role="status"></p>
  </form>
</dialog>
